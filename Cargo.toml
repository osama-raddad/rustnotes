[workspace]
resolver = "2"
members = ["crates/rustnotes-core", "crates/rustnotes-android", "crates/rustnotes-ios"]

[workspace.dependencies]
log = "0.4"
glow = "0.14"
fontdue = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
