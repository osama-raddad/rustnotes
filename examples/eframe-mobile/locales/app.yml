# rust-i18n v2 layout: one key, every language. Loaded at compile time by
# `i18n!("locales")`, so `t!()` is a cheap lookup inside the render loop.
#
# `ar` is a glyph-coverage demo: egui 0.36 has no right-to-left reordering
# or Arabic shaping, so these strings render in logical (wrong) order.
_version: 2
app.title:
  en: Mobile App
  ar: تطبيق الجوال
  zh-CN: 移动应用
app.greeting:
  en: Hello, %{name}!
  ar: مرحباً %{name}!
  zh-CN: 你好，%{name}！
app.counter:
  en: "Taps: %{count}"
  ar: "النقرات: %{count}"
  zh-CN: "点击次数：%{count}"
app.tap_me:
  en: Tap me
  ar: اضغط هنا
  zh-CN: 点我
app.orientation.portrait:
  en: Portrait layout
  ar: تخطيط عمودي
  zh-CN: 竖屏布局
app.orientation.landscape:
  en: Landscape layout
  ar: تخطيط أفقي
  zh-CN: 横屏布局
app.language:
  en: Language
  ar: اللغة
  zh-CN: 语言
app.theme:
  en: Theme
  ar: السمة
  zh-CN: 主题
