[package]
name = "hello-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.95" # egui 0.36 floor
description = "Minimal second consumer of the rustnotes host: the generalization proof for the extraction plan's Q2"

# One crate, two shapes, mirroring rustnotes: Android's NativeActivity
# loads the cdylib and calls `android_main`; iOS and desktop run the
# binary in src/main.rs.
[lib]
name = "hello_mobile"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hello-mobile"
path = "src/main.rs"

# The backend swap, mirroring rustnotes' (see its Cargo.toml for the full
# rationale — android-activity compile_error!s on both-on and on neither).
# This crate must carry the choice itself: it declares android-activity
# for its own `android_main` signature AND consumes rustnotes with
# `default-features = false`, so the host's `android-native-activity`
# default never leaks in — opt into GameActivity here
# (`--features android-game-activity`) exactly as in the host.
[features]
default = ["android-native-activity"]
android-native-activity = [
    "rustnotes/android-native-activity",
    "android-activity/native-activity",
]
android-game-activity = [
    "rustnotes/android-game-activity",
    "android-activity/game-activity",
]

[dependencies]
# THE point of this crate: the host, consumed as a framework. Default
# features are off so this crate's own `android_main` (src/lib.rs) is the
# only one linked; see rustnotes' Cargo.toml for the symbol-collision
# rationale. And there is deliberately NO rustnotes-core dependency
# anywhere here — that is the generalization proof.
rustnotes = { path = "../rustnotes", default-features = false }
log.workspace = true
egui.workspace = true
# The bin's `eframe::Result` return type only; renderer features arrive
# through rustnotes' own target-scoped eframe deps (features unify).
eframe.workspace = true

# Desktop only: the iOS binary logs through the host's panic hook (NSLog)
# instead — same scoping as rustnotes.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11"

# The lib's `android_main` signature; winit gets the AndroidApp through
# the host's `start`, which sets `options.android_app` itself. Backend-free
# like the host's android-target deps: the activity class is chosen by the
# features above.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
