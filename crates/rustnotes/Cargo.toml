[package]
name = "rustnotes"
version = "0.1.0"
edition = "2021"
rust-version = "1.95" # egui 0.36 floor
description = "Rust Notes host: runs rustnotes-core with eframe on Android, iOS and desktop"

# One crate, two shapes: Android's NativeActivity loads the cdylib and calls
# `android_main`; iOS and desktop run the binary in src/main.rs.
[lib]
name = "rustnotes"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustnotes"
path = "src/main.rs"

[dependencies]
rustnotes-core = { path = "../rustnotes-core" }
log.workspace = true
egui.workspace = true
# eframe's default feature set includes `accesskit`, which refuses to build
# with NativeActivity on Android, so features are spelled out per target.
# `default_fonts` keeps egui's bundled font as the fallback if no system font
# can be read.
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }

# Renderer per platform: glow (OpenGL ES 3) on Android and desktop; wgpu
# (Metal) on iOS, because eframe's glow path needs glutin, which has no iOS
# backend.
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSObject",
    "NSValue",
    "NSNotification",
] }
objc2-core-foundation = { version = "0.3", features = ["CFURL"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor"] }
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication",
    "UIWindow",
    "UIScreen",
    "UIView",
    "UIResponder",
    "UIGeometry",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
jni = "0.22"

# Linux desktop: with default features off nothing selects a winit backend.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
