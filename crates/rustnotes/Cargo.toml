[package]
name = "rustnotes"
version = "0.1.0"
edition = "2021"
rust-version = "1.95" # egui 0.36 floor
description = "Rust Notes host: runs rustnotes-core with eframe on Android, iOS and desktop"

# One crate, two shapes: Android's NativeActivity loads the cdylib and calls
# `android_main`; iOS and desktop run the binary in src/main.rs.
[lib]
name = "rustnotes"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustnotes"
path = "src/main.rs"

[features]
# Compile this crate's own `android_main` (the Rust Notes app entry).
# Default-on so every existing recipe (justfile, xbuild, plain cargo) keeps
# producing a launchable Rust Notes cdylib unchanged. A second consumer that
# links this crate as a dependency MUST opt out (`default-features = false`)
# or the two `#[no_mangle] android_main` symbols collide at link time —
# `cargo check` cannot see this (it does not link); the collision is a
# build-time landmine the feature defuses.
# Caveat: feature unification re-arms it — building rustnotes together
# with a consumer for an Android target (`--workspace`, `--all`, multiple
# `-p`s) turns android-entry back on for the shared unit and re-creates
# the collision at link (NDK lld: duplicate symbol; the `cargo check`
# twin of the same command passes silently). Build Android targets
# per-package, as `just check` does.
default = ["android-entry"]
android-entry = []

[dependencies]
rustnotes-core = { path = "../rustnotes-core" }
log.workspace = true
egui.workspace = true
# Turning off eframe's default features disables egui-winit's accesskit
# *integration*, which is what refuses to build with NativeActivity on
# Android, so features are spelled out per target. (The accesskit crate
# itself is still compiled everywhere — egui depends on it unconditionally;
# only the winit wiring is feature-gated.) `default_fonts` keeps egui's
# bundled font as the fallback if no system font can be read.
eframe = { workspace = true, features = ["default_fonts"] }

# Renderer per platform: glow (OpenGL ES 3) on Android and desktop; wgpu
# (Metal) on iOS, because eframe's glow path needs glutin, which has no iOS
# backend. Android can't take accesskit — NativeActivity has no winit
# integration to hang it on (eframe compile_error!s on the pairing).
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { workspace = true, features = ["glow"] }

# Desktop-only screen-reader support (accesskit pairs fine with glow/wgpu
# wherever winit's integration exists — just not under NativeActivity).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSObject",
    "NSNotification",
] }
objc2-core-foundation = { version = "0.3", features = ["CFURL"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor"] }
# The generated UIApplication and UIWindow class types are cfg-gated on the
# UIResponder / UIView features (their class-hierarchy supers), so those two
# look unused here but are load-bearing; the keyboard-frame constants come
# from UIWindow. UIScreen and foundation's NSValue have zero references in
# src (ios.rs goes through raw class!/msg_send!, CGRect via core-foundation)
# and are trimmed.
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication",
    "UIWindow",
    "UIGeometry",
    "UIView",
    "UIResponder",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
jni = "0.22"

# Linux desktop: with default features off nothing selects a winit backend.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

# Desktop only: the iOS binary logs through the panic hook (NSLog) instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11"
