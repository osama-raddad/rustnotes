# All generated artifacts live under build/ — cargo's target dir included
# (relative paths here resolve against this file's parent, i.e. the root).
[build]
target-dir = "build/target"

# Android target. The linker is NOT set here — the justfile exports
# CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER instead (env only, derived from
# `sdk`, which honors ANDROID_HOME, so it works wherever the NDK actually
# is). CC/AR for C dependencies (rusqlite bundled) are exported there too —
# this file stays free of machine-specific paths.
[target.aarch64-linux-android]
# 16 KB page alignment (required for Pixel-class 16 KB kernel devices)
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
